<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SpendLog AI - Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- ================= HEADER ================= -->

<nav class="navbar bg-dark navbar-dark">

    <div class="container">

        <span class="navbar-brand fw-bold">
            SpendLog AI
        </span>

    </div>

</nav>



<!-- ================= DASHBOARD ================= -->

<main class="container py-5">


    <!-- TITLE -->

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            SpendLog AI
        </h1>

        <p class="text-muted">
            Record Every Rupee. Find It Anytime.
        </p>

    </div>



    <!-- ================= ACTION CARDS ================= -->

    <div class="row g-4 justify-content-center">


        <!-- ADD EXPENSE -->

        <div class="col-md-4">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center p-4">

                    <div class="mb-3 fs-1">
                        💸
                    </div>

                    <h4 class="fw-bold">
                        Add Expense
                    </h4>

                    <p class="text-muted">
                        Record money you spent.
                    </p>

                    <a
                        href="expenses.html"
                        class="btn btn-dark w-100 mt-2"
                    >
                        Add Expense
                    </a>

                </div>

            </div>

        </div>



        <!-- MONEY RECEIVED -->

        <div class="col-md-4">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center p-4">

                    <div class="mb-3 fs-1">
                        💰
                    </div>

                    <h4 class="fw-bold">
                        Money Received
                    </h4>

                    <p class="text-muted">
                        Record money you received.
                    </p>

                    <a
                        href="money_received.html"
                        class="btn btn-dark w-100 mt-2"
                    >
                        Add Money Received
                    </a>

                </div>

            </div>

        </div>



        <!-- SEARCH RECORDS -->

        <div class="col-md-4">

            <div class="card shadow-sm h-100">

                <div class="card-body text-center p-4">

                    <div class="mb-3 fs-1">
                        🔍
                    </div>

                    <h4 class="fw-bold">
                        Search Records
                    </h4>

                    <p class="text-muted">
                        Find your saved records.
                    </p>

                    <a
                        href="search.html"
                        class="btn btn-dark w-100 mt-2"
                    >
                        Search Records
                    </a>

                </div>

            </div>

        </div>


    </div>


</main>



<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
>
</script>


</body>

</html>
