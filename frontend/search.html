<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Search Records - SpendLog AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>


<body>

    <!-- ================= HEADER ================= -->

    <nav class="navbar bg-dark navbar-dark">

        <div class="container">

            <a
                class="navbar-brand fw-bold"
                href="index.html"
            >
                SpendLog AI
            </a>

        </div>

    </nav>


    <!-- ================= MAIN ================= -->

    <main class="container py-5">

        <!-- TITLE -->

        <div class="text-center mb-4">

            <h1 class="fw-bold">
                Search Your Records
            </h1>

            <p class="text-muted">
                Find your expense records anytime
            </p>

        </div>


        <!-- ================= SEARCH FORM ================= -->

        <div class="card shadow-sm mb-4">

            <div class="card-body p-4">

                <h4 class="fw-bold mb-4">
                    Search Options
                </h4>


                <!-- SEARCH TYPE -->

                <div class="mb-3">

                    <label
                        for="searchType"
                        class="form-label fw-semibold"
                    >
                        Search By
                    </label>

                    <select
                        id="searchType"
                        class="form-select"
                    >

                        <option value="day">
                            Day
                        </option>

                        <option value="month">
                            Month
                        </option>

                        <option value="year">
                            Year
                        </option>

                        <option value="item">
                            Item
                        </option>

                    </select>

                </div>


                <!-- DAY -->

                <div
                    id="dayInput"
                    class="search-input mb-3"
                >

                    <label
                        for="searchDate"
                        class="form-label fw-semibold"
                    >
                        Select Date
                    </label>

                    <input
                        type="date"
                        id="searchDate"
                        class="form-control"
                    >

                </div>


                <!-- MONTH -->

                <div
                    id="monthInput"
                    class="search-input mb-3"
                    style="display: none;"
                >

                    <label
                        for="searchMonth"
                        class="form-label fw-semibold"
                    >
                        Select Month
                    </label>

                    <input
                        type="month"
                        id="searchMonth"
                        class="form-control"
                    >

                </div>


                <!-- YEAR -->

                <div
                    id="yearInput"
                    class="search-input mb-3"
                    style="display: none;"
                >

                    <label
                        for="searchYear"
                        class="form-label fw-semibold"
                    >
                        Enter Year
                    </label>

                    <input
                        type="number"
                        id="searchYear"
                        class="form-control"
                        placeholder="2026"
                        min="2000"
                        max="2100"
                    >

                </div>


                <!-- ITEM -->

                <div
                    id="itemInput"
                    class="search-input mb-3"
                    style="display: none;"
                >

                    <label
                        for="searchItem"
                        class="form-label fw-semibold"
                    >
                        Enter Item Name
                    </label>

                    <input
                        type="text"
                        id="searchItem"
                        class="form-control"
                        placeholder="Example: Notebook"
                    >

                </div>


                <!-- SEARCH BUTTON -->

                <button
                    id="searchButton"
                    type="button"
                    class="btn btn-dark w-100"
                >
                    Search Records
                </button>

            </div>

        </div>


        <!-- ================= PROGRESS ================= -->

        <div
            id="progressBox"
            class="card shadow-sm mb-4"
            style="display: none;"
        >

            <div class="card-body">

                <h5 class="fw-bold">
                    Search Progress
                </h5>

                <div
                    id="progressMessage"
                    class="text-muted"
                >
                    Starting search...
                </div>

            </div>

        </div>


        <!-- ================= RESULTS ================= -->

        <div
            id="resultBox"
            class="card shadow-sm"
            style="display: none;"
        >

            <div class="card-body">

                <div
                    class="d-flex justify-content-between align-items-center mb-4"
                >

                    <h4 class="fw-bold mb-0">
                        Search Results
                    </h4>

                    <div>

                        <span class="fw-bold">
                            Total:
                        </span>

                        <span
                            id="totalAmount"
                            class="fw-bold"
                        >
                            ₹0
                        </span>

                    </div>

                </div>


                <!-- RESULTS TABLE -->

                <div class="table-responsive">

                    <table class="table table-bordered table-hover">

                        <thead class="table-dark">

                            <tr>

                                <th>ID</th>
                                <th>Amount</th>
                                <th>Item Name</th>
                                <th>Expense Date</th>

                            </tr>

                        </thead>

                        <tbody id="resultTableBody"></tbody>

                    </table>

                </div>

            </div>

        </div>


        <!-- ================= MESSAGE ================= -->

        <div
            id="searchMessage"
            class="mt-4 text-center fw-bold"
        ></div>


        <!-- ================= BACK BUTTON ================= -->

        <div class="text-center mt-4">

            <a
                href="index.html"
                class="btn btn-outline-secondary"
            >
                ← Back to Dashboard
            </a>

        </div>

    </main>


    <!-- ================= SEARCH JAVASCRIPT ================= -->

    <script src="js/search.js"></script>

</body>

</html>
