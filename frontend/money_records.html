<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Money Received Records - SpendLog AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- ================= HEADER ================= -->

<nav class="navbar bg-dark navbar-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html"
        >
            SpendLog AI
        </a>

    </div>

</nav>



<!-- ================= MAIN ================= -->

<main class="container py-5">


    <!-- TITLE -->

    <div class="text-center mb-4">

        <h1 class="fw-bold">
            Money Received Records
        </h1>

        <p class="text-muted">
            View and manage your received money records
        </p>

    </div>



    <!-- ================= RECORDS TABLE ================= -->

    <div class="card shadow-sm">

        <div class="card-body p-4">


            <h3 class="fw-bold mb-4">
                All Money Received
            </h3>


            <div class="table-responsive">

                <table
                    class="table table-bordered table-hover align-middle"
                >

                    <thead class="table-dark">

                        <tr>

                            <th>
                                ID
                            </th>

                            <th>
                                Amount
                            </th>

                            <th>
                                Received From
                            </th>

                            <th>
                                Received Date
                            </th>

                            <th>
                                Actions
                            </th>

                        </tr>

                    </thead>


                    <tbody id="moneyTableBody">

                    </tbody>

                </table>

            </div>


        </div>

    </div>



    <!-- ================= MESSAGE ================= -->

    <div
        id="moneyRecordsMessage"
        class="mt-4 text-center fw-bold"
    ></div>



    <!-- ================= BACK BUTTONS ================= -->

    <div class="text-center mt-4">

        <a
            href="money_received.html"
            class="btn btn-dark me-2"
        >
            ← Money Received
        </a>

        <a
            href="index.html"
            class="btn btn-outline-secondary"
        >
            Dashboard
        </a>

    </div>


</main>



<!-- ================= JAVASCRIPT ================= -->

<script src="js/money_records.js"></script>


</body>

</html>
