<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Unlock - SpendLog AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<main class="container">

    <div
        class="row justify-content-center align-items-center min-vh-100"
    >

        <div class="col-md-5 col-lg-4">


            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <!-- TITLE -->

                    <div class="text-center mb-4">

                        <h2 class="fw-bold">
                            SpendLog AI
                        </h2>

                        <p class="text-muted mb-0">
                            Enter password to access protected records
                        </p>

                    </div>



                    <!-- PASSWORD FORM -->

                    <form id="unlockForm">


                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label fw-semibold"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Enter password"
                                autocomplete="current-password"
                                required
                            >

                        </div>



                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Unlock
                        </button>


                    </form>



                    <!-- MESSAGE -->

                    <div
                        id="unlockMessage"
                        class="mt-3 text-center fw-bold"
                    ></div>



                    <!-- BACK -->

                    <div class="text-center mt-4">

                        <a
                            href="index.html"
                            class="text-decoration-none text-muted"
                        >
                            ← Back to Dashboard
                        </a>

                    </div>


                </div>

            </div>


        </div>

    </div>

</main>



<script src="js/unlock.js"></script>


</body>

</html>
