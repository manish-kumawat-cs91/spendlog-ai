<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Money Received - SpendLog AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- ================= HEADER ================= -->

<nav class="navbar bg-dark navbar-dark">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="index.html"
        >
            SpendLog AI
        </a>

    </div>

</nav>



<!-- ================= MAIN ================= -->

<main class="container py-5">


    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">


            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <!-- TITLE -->

                    <h2 class="text-center fw-bold mb-2">
                        Money Received
                    </h2>


                    <p class="text-center text-muted mb-4">
                        Record money you received
                    </p>



                    <!-- ================= FORM ================= -->

                    <form id="moneyForm">


                        <!-- AMOUNT -->

                        <div class="mb-3">

                            <label
                                for="amount"
                                class="form-label fw-semibold"
                            >
                                Amount
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                id="amount"
                                placeholder="Enter amount"
                                step="0.01"
                                min="0.01"
                                required
                            >

                        </div>



                        <!-- RECEIVED FROM -->

                        <div class="mb-3">

                            <label
                                for="receivedFrom"
                                class="form-label fw-semibold"
                            >
                                Received From
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="receivedFrom"
                                placeholder="Example: Father"
                                required
                            >

                        </div>



                        <!-- RECEIVED DATE -->

                        <div class="mb-4">

                            <label
                                for="receivedDate"
                                class="form-label fw-semibold"
                            >
                                Received Date
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                id="receivedDate"
                                required
                            >

                        </div>



                        <!-- SUBMIT -->

                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Add Money Received
                        </button>


                    </form>



                    <!-- MESSAGE -->

                    <div
                        id="moneyMessage"
                        class="mt-3 text-center"
                    ></div>



                    <!-- ================= OTHER ACTIONS ================= -->

                    <div class="mt-4">

                        <div class="row g-2">


                            <!-- MONEY RECORDS -->

                            <div class="col-md-4">

                                <a
                                    href="unlock.html?next=money_records.html"
                                    class="btn btn-outline-dark w-100"
                                >
                                    View Money Records
                                </a>

                            </div>



                            <!-- ADD EXPENSE -->

                            <div class="col-md-4">

                                <a
                                    href="expenses.html"
                                    class="btn btn-outline-dark w-100"
                                >
                                    Add Expense
                                </a>

                            </div>



                            <!-- DASHBOARD -->

                            <div class="col-md-4">

                                <a
                                    href="index.html"
                                    class="btn btn-outline-secondary w-100"
                                >
                                    Dashboard
                                </a>

                            </div>


                        </div>

                    </div>


                </div>

            </div>


        </div>

    </div>


</main>



<!-- ================= JAVASCRIPT ================= -->

<script src="js/money.js"></script>


</body>

</html>
